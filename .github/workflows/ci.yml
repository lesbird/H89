name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Fetch ZEX exercisers
        shell: bash
        run: tools/fetch_zex.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Checks the Windows installer still builds; the Release workflow
      # publishes it.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          cpack -C Release
